[package]
name = "mirl_buffer_interpolation"
version = "0.0.0-alpha"
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["std"]
std = [
    "bitcode?/std",
    "mirl_extensions_math/std",
    "mirl_graphics/std",
    "serde?/std",
    "strum?/std",
    "wincode?/std",
    "zerocopy?/std",
]
# Does nothing by itself. Needs another codec or enum flag to do something
mirl_derive = ["dep:mirl_derive", "mirl_graphics/mirl_derive"]
# Compatibility with ffi
c_compatible = ["mirl_derive", "mirl_graphics/c_compatible"]
# Enables all codecs
all_codecs = [
    "serde",
    "bitcode",
    "wincode",
    "compactly",
    "zerocopy",
    "mirl_graphics/all_codecs",
]
# All enum extensions
all_enum_extensions = ["strum", "enum_ext"]
# Codec stuff
serde = ["dep:serde", "mirl_derive", "mirl_graphics/serde", "bitcode?/serde"]
bitcode = ["dep:bitcode", "mirl_derive", "mirl_graphics/bitcode"]
wincode = ["dep:wincode", "mirl_derive", "mirl_graphics/wincode"]
compactly = ["dep:compactly", "mirl_derive", "mirl_graphics/compactly"]
zerocopy = ["dep:zerocopy", "mirl_derive", "mirl_graphics/zerocopy"]
# Enum extensions
strum = ["dep:strum", "mirl_derive", "mirl_graphics/strum"]
enum_ext = ["dep:enum_ext", "mirl_derive", "mirl_graphics/enum_ext"]

[dependencies]
bitcode = { version = "0.6", optional = true, default-features = false, features = [
    "derive",
] }
# Codec
compactly = { version = "0.1", optional = true }
enum_ext = { version = "0.6", optional = true, default-features = false }
mirl_derive = { version = "0.0.0-alpha", optional = true }
mirl_extensions_math = { version = "0.0.0-alpha" }
mirl_graphics = { version = "0.0.0-alpha" }
serde = { version = "1.0", optional = true, default-features = false, features = [
    "derive",
] }
# Enum functionality
strum = { version = "0.28", optional = true, default-features = false, features = [
    "derive",
] }
wincode = { version = "0.5", optional = true, features = ["derive"] }
zerocopy = { version = "0.8", optional = true, default-features = false, features = [
    "float-nightly",
    "derive",
] }

[build-dependencies]
mirl_build_tools = { workspace = true }

[lints]
workspace = true
